<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU 监控</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #111318;
            --bg-tertiary: #1a1d24;
            --bg-card: #14171c;
            --bg-hover: #1e2128;
            --bg-input: #0d1117;
            --text-primary: #f0f2f5;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-primary: #2d333b;
            --border-card: #21262d;
            --border-hover: #30363d;
            --color-primary: #818cf8;
            --color-primary-dark: #6366f1;
            --color-primary-light: #a5b4fc;
            --color-primary-rgb: 99, 102, 241;
            --color-success: #34d399;
            --color-success-dark: #10b981;
            --color-warning: #fbbf24;
            --color-danger: #f87171;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.5);
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
            animation: bg-rotate 20s linear infinite;
            pointer-events: none;
        }

        @keyframes bg-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .gpum-container {
            position: relative;
            z-index: 1;
            padding: var(--space-xl);
            max-width: 1400px;
            margin: 0 auto;
        }

        .gpum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-lg) var(--space-xl);
            background: linear-gradient(135deg, rgba(var(--color-primary-rgb), 0.08) 0%, rgba(var(--color-primary-rgb), 0.02) 100%);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            margin-bottom: var(--space-xl);
        }

        .gpum-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .gpum-title i {
            color: var(--color-primary);
        }

        .gpum-status {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .gpum-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-success);
            box-shadow: 0 0 8px var(--color-success);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .gpum-status-dot.gpum-offline {
            background: var(--text-muted);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.3); }
        }

        .gpum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }

        .gpum-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, rgba(20, 23, 28, 0.8) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-2xl);
            padding: var(--space-xl);
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: fade-in 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gpum-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-primary-light), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gpum-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md), 0 0 20px rgba(99, 102, 241, 0.15);
            border-color: var(--border-hover);
        }

        .gpum-card:hover::before {
            opacity: 0.6;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gpum-card-header {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }

        .gpum-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, rgba(var(--color-primary-rgb), 0.15) 0%, rgba(var(--color-primary-rgb), 0.05) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-primary);
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .gpum-card-title {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gpum-card-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-mono);
            margin-top: 4px;
            letter-spacing: -0.02em;
        }

        .gpum-progress {
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            margin-top: var(--space-md);
            overflow: hidden;
            position: relative;
        }

        .gpum-progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .gpum-progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .gpum-progress-fill.gpum-success { background: linear-gradient(90deg, var(--color-success) 0%, var(--color-success-dark) 100%); }
        .gpum-progress-fill.gpum-warning { background: linear-gradient(90deg, var(--color-warning) 0%, #f59e0b 100%); }
        .gpum-progress-fill.gpum-danger { background: linear-gradient(90deg, var(--color-danger) 0%, #ef4444 100%); }
        .gpum-progress-fill { background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-dark) 100%); }

        .gpum-table-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, rgba(20, 23, 28, 0.8) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fade-in 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gpum-table-header {
            padding: var(--space-lg) var(--space-xl);
            background: linear-gradient(135deg, rgba(var(--color-primary-rgb), 0.06) 0%, rgba(var(--color-primary-rgb), 0.02) 100%);
            border-bottom: 1px solid var(--border-card);
        }

        .gpum-table-title {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .gpum-table-title i {
            color: var(--color-primary);
        }

        .gpum-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .gpum-table th,
        .gpum-table td {
            padding: var(--space-md) var(--space-xl);
            text-align: left;
            border-bottom: 1px solid var(--border-primary);
        }

        .gpum-table th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gpum-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .gpum-table tbody tr:last-child td {
            border-bottom: none;
        }

        .gpum-empty {
            text-align: center;
            color: var(--text-muted);
            padding: var(--space-2xl);
        }

        .gpum-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
            padding: var(--space-3xl);
            color: var(--text-secondary);
        }

        .gpum-loading::before {
            content: '';
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-primary);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .gpum-error {
            color: var(--color-danger);
            padding: var(--space-lg) var(--space-xl);
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: var(--radius-lg);
            margin: var(--space-lg);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .gpum-error::before {
            content: '⚠';
            font-size: 1.2em;
        }

        .gpum-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-sans);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border-color: var(--border-primary);
        }

        .gpum-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .gpum-btn:active {
            transform: scale(0.98);
        }

        .gpum-btn-primary {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(var(--color-primary-rgb), 0.3);
            border-color: transparent;
        }

        .gpum-btn-primary:hover {
            box-shadow: 0 4px 12px rgba(var(--color-primary-rgb), 0.4);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary-dark);
        }

        @media (max-width: 768px) {
            .gpum-container {
                padding: var(--space-md);
            }

            .gpum-grid {
                grid-template-columns: 1fr;
            }

            .gpum-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-sm);
            }
        }
    </style>
</head>
<body>
    <div class="gpum-container">
        <div class="gpum-header">
            <div class="gpum-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                    <rect x="9" y="9" width="6" height="6"></rect>
                    <line x1="9" y1="1" x2="9" y2="4"></line>
                    <line x1="15" y1="1" x2="15" y2="4"></line>
                    <line x1="9" y1="20" x2="9" y2="23"></line>
                    <line x1="15" y1="20" x2="15" y2="23"></line>
                    <line x1="20" y1="9" x2="23" y2="9"></line>
                    <line x1="20" y1="14" x2="23" y2="14"></line>
                    <line x1="1" y1="9" x2="4" y2="9"></line>
                    <line x1="1" y1="14" x2="4" y2="14"></line>
                </svg>
                GPU 监控
            </div>
            <div class="gpum-status">
                <div class="gpum-status-dot" id="status-dot"></div>
                <span id="status-text">加载中...</span>
            </div>
        </div>

        <div class="gpum-grid">
            <div class="gpum-card">
                <div class="gpum-card-header">
                    <div class="gpum-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                </div>
                <div class="gpum-card-title">GPU型号</div>
                <div class="gpum-card-value" id="gpu-name">--</div>
            </div>

            <div class="gpum-card">
                <div class="gpum-card-header">
                    <div class="gpum-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                    </div>
                </div>
                <div class="gpum-card-title">GPU利用率</div>
                <div class="gpum-card-value" id="gpu-util">--</div>
                <div class="gpum-progress">
                    <div class="gpum-progress-fill" id="gpu-util-bar"></div>
                </div>
            </div>

            <div class="gpum-card">
                <div class="gpum-card-header">
                    <div class="gpum-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </div>
                </div>
                <div class="gpum-card-title">显存使用</div>
                <div class="gpum-card-value" id="gpu-mem">--</div>
                <div class="gpum-progress">
                    <div class="gpum-progress-fill" id="gpu-mem-bar"></div>
                </div>
            </div>

            <div class="gpum-card">
                <div class="gpum-card-header">
                    <div class="gpum-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
                        </svg>
                    </div>
                </div>
                <div class="gpum-card-title">温度</div>
                <div class="gpum-card-value" id="gpu-temp">--</div>
            </div>

            <div class="gpum-card">
                <div class="gpum-card-header">
                    <div class="gpum-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                    </div>
                </div>
                <div class="gpum-card-title">功耗</div>
                <div class="gpum-card-value" id="gpu-power">--</div>
            </div>
        </div>

        <div class="gpum-table-card">
            <div class="gpum-table-header">
                <div class="gpum-table-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    GPU进程
                </div>
            </div>
            <table class="gpum-table" id="gpu-processes">
                <thead>
                    <tr>
                        <th>PID</th>
                        <th>进程名</th>
                        <th>显存占用</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="3" class="gpum-empty">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = '/api/ai-os-manager';
        let refreshInterval = null;

        async function fetchData() {
            try {
                const res = await fetch(API_BASE + '/gpu/status');
                const data = await res.json();

                if (!data.success) {
                    document.getElementById('status-dot').classList.add('gpum-offline');
                    document.getElementById('status-text').textContent = '离线';
                    return;
                }

                document.getElementById('status-dot').classList.remove('gpum-offline');
                document.getElementById('status-text').textContent = '在线';

                const info = data.info;
                document.getElementById('gpu-name').textContent = info.gpu_name || '--';

                const utilization = info.gpu_utilization || 0;
                document.getElementById('gpu-util').textContent = utilization.toFixed(1) + '%';
                const utilBar = document.getElementById('gpu-util-bar');
                utilBar.style.width = utilization + '%';
                utilBar.className = 'gpum-progress-fill ' + (utilization > 80 ? 'gpum-danger' : utilization > 50 ? 'gpum-warning' : 'gpum-success');

                const memUsed = info.memory_used_gb || 0;
                const memTotal = info.memory_total_gb || 0;
                const memPercent = memTotal > 0 ? (memUsed / memTotal * 100) : 0;
                document.getElementById('gpu-mem').textContent = memUsed.toFixed(1) + ' / ' + memTotal.toFixed(1) + ' GB';
                const memBar = document.getElementById('gpu-mem-bar');
                memBar.style.width = memPercent + '%';
                memBar.className = 'gpum-progress-fill ' + (memPercent > 80 ? 'gpum-danger' : memPercent > 50 ? 'gpum-warning' : 'gpum-success');

                const temp = info.temperature || 0;
                document.getElementById('gpu-temp').textContent = temp + '°C';

                const power = info.power_usage ? (info.power_usage / 1000).toFixed(1) + ' W' : '--';
                document.getElementById('gpu-power').textContent = power;

                const tbody = document.querySelector('#gpu-processes tbody');
                if (info.processes && info.processes.length > 0) {
                    tbody.innerHTML = info.processes.map(p =>
                        '<tr><td>' + p.pid + '</td><td>' + p.name + '</td><td>' + (p.gpu_memory || 0).toFixed(1) + ' GB</td></tr>'
                    ).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="gpum-empty">无进程</td></tr>';
                }

            } catch (e) {
                document.getElementById('status-dot').classList.add('gpum-offline');
                document.getElementById('status-text').textContent = '离线';
            }
        }

        fetchData();
        refreshInterval = setInterval(fetchData, 5000);

        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
