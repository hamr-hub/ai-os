<!-- GPU Monitor Section - 插件扩展组件 -->
<div id="gpu-monitor" class="section" data-section="gpu-monitor" style="display: none;">
    <div class="section-header">
        <h2><i class="fas fa-microchip"></i> GPU 监控与模型切换</h2>
    </div>
    
    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-desktop"></i> GPU 状态</h3>
            <button class="btn btn-sm btn-primary" id="gpuRefreshBtn">
                <i class="fas fa-sync-alt"></i> 刷新
            </button>
        </div>
        <div class="card-body">
            <div id="gpuStatusContent">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>加载中...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <div class="card-header">
            <h3><i class="fas fa-exchange-alt"></i> 模型切换</h3>
        </div>
        <div class="card-body">
            <div id="modelSwitchContent">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>加载中...</span>
                </div>
            </div>
        </div>
    </div>
</div>
