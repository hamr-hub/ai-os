services:
  aiclient:
    image: justlikemaki/aiclient-2-api:latest
    container_name: aiclient
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8085-8087:8085-8087"
      - "1455:1455"
      - "19876-19880:19876-19880"
    volumes:
      - ./configs:/app/configs
      - ./plugins:/app/src/plugins
    environment:
      - ARGS=
      - NODE_ENV=production
      - GO_BACKEND_URL=http://localhost:35001
      - PYTHON_BACKEND_URL=http://localhost:35000
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
