meta:
  title: "模型下载功能完善 - HF_TOKEN/下载路径/各种API优化"
  platform: "backend"
  task_id: "model-download-enhance"
  requirement_version: "v1.0"
  requirement_confidence: "high"

scope:
  in_scope:
    - "HF_TOKEN 认证支持 - 环境变量和配置文件传入 token 参数"
    - "HuggingFace snapshot_download 全参数支持 - endpoint/token/allow_patterns/ignore_patterns/max_workers/force_download/local_dir"
    - "ModelScope snapshot_download 全参数支持 - local_dir/allow_patterns/ignore_patterns/max_workers/progress_callbacks"
    - "下载路径配置增强 - 保存目录可自定义，ModelScope 使用 local_dir 替代 cache_dir"
    - "DownloadConfig Pydantic 模型 - 类型安全的下载配置"
    - "DownloadRequest API 扩展 - 支持 hf_token/allow_patterns/ignore_patterns/save_dir 等参数"
    - "下载进度回调 - 使用 tqdm_class 从 HF SDK 获取实时进度"
    - ".env.example 更新 - 增加 HF_TOKEN/HF_ENDPOINT 变量"
    - "config.yaml 配置扩展 - 增加 engines.hub.hf_token/ms_token 等字段"
  out_of_scope:
    - "OpenXLab 源实现（P2，后续迭代）"
    - "下载任务持久化到数据库"
    - "Checksum 校验实现"
    - "前端 UI 大改（仅适配新增 API 参数）"

global_constraints:
  - "不得破坏现有下载功能/API 兼容性"
  - "所有新参数必须有合理默认值，不影响现有调用"
  - "HF_TOKEN 优先级：API请求参数 > 环境变量 > config.yaml"

file_changes:
  - path: "app-controller/core/config.py"
    change: "modify"
    summary: "新增 DownloadConfig Pydantic 模型，包含 hf_token/ms_token/save_root/hf_endpoint/max_concurrent/allow_patterns/ignore_patterns"
    risk: "low"
  - path: "app-controller/core/model_hub.py"
    change: "modify"
    summary: "download_model 方法增加 hf_token/allow_patterns/ignore_patterns/max_workers/force_download 参数；_download_hf 传入 token/allow_patterns/ignore_patterns/max_workers；_download_ms 传入 local_dir/allow_patterns/ignore_patterns/max_workers/progress_callbacks；_search_hf 传入 token；新增 _hf_token 属性"
    risk: "medium"
  - path: "app-controller/core/download_manager.py"
    change: "modify"
    summary: "DownloadTask 增加 hf_token/allow_patterns/ignore_patterns 字段；create_task 方法支持新参数并透传给 model_hub；_execute_download 透传 hf_token 等参数；新增 TqdmProgressCallback 类用于实时进度更新"
    risk: "medium"
  - path: "app-controller/routes/model_hub.py"
    change: "modify"
    summary: "DownloadRequest 新增 hf_token/allow_patterns/ignore_patterns/max_workers/force_download 字段；download_model endpoint 透传新参数"
    risk: "low"
  - path: "app-controller/routes/manage.py"
    change: "modify"
    summary: "start_download endpoint 解析新增的 hf_token/allow_patterns/ignore_patterns 参数"
    risk: "low"
  - path: "app-controller/config.yaml"
    change: "modify"
    summary: "engines.hub 增加 hf_token/ms_token/max_workers 字段"
    risk: "low"
  - path: "app-controller/.env.example"
    change: "modify"
    summary: "新增 HF_TOKEN/HF_ENDPOINT 变量"
    risk: "low"
  - path: "app-controller/core/deps.py"
    change: "modify"
    summary: "初始化时从 config/env 读取 HF_TOKEN 并注入到 model_hub"
    risk: "low"
  - path: "app-controller/tests/test_model_hub.py"
    change: "modify"
    summary: "新增测试：download_model 带 token 参数、allow_patterns/ignore_patterns、ModelScope local_dir、HF search 带 token"
    risk: "low"
  - path: "app-controller/tests/test_download_manager.py"
    change: "modify"
    summary: "新增测试：create_task 带 hf_token、进度回调、TqdmProgressCallback"
    risk: "low"
  - path: "frontend/src/api/client.ts"
    change: "modify"
    summary: "startDownload 函数新增 hfToken/allowPatterns/ignorePatterns 参数"
    risk: "low"
  - path: "frontend/src/types/index.ts"
    change: "modify"
    summary: "DownloadTask 类型新增 hf_token/allow_patterns/ignore_patterns 字段"
    risk: "low"

api:
  - name: "startDownload"
    layer: "backend"
    endpoint: "/manage/hub/download"
    method: "POST"
    request_schema:
      model_name: "string"
      source: "string"
      save_dir: "string?"
      auto_start: "boolean"
      hf_token: "string?"
      allow_patterns: "string[]?"
      ignore_patterns: "string[]?"
      max_workers: "int?"
      force_download: "boolean?"
    response_schema:
      task_id: "string"
      status: "string"
      model_name: "string"
      source: "string"
    error_codes:
      - code: "400"
        meaning: "缺少 model_name 参数"
        handling: "返回 400 错误"
      - code: "503"
        meaning: "磁盘空间不足"
        handling: "返回磁盘不足信息"

validation:
  acceptance:
    - "HF_TOKEN 通过环境变量 HF_TOKEN 配置后，snapshot_download 传入 token 参数，可下载私有/门控模型"
    - "API 请求中传入 hf_token 参数时优先使用，不传则使用 config/env 中的 token"
    - "下载路径可通过 save_dir 参数自定义，ModelScope 使用 local_dir 替代 cache_dir"
    - "allow_patterns/ignore_patterns 传入后，snapshot_download 传入对应参数，选择性下载文件"
    - "max_workers 参数从 API/config 传入到 snapshot_download"
    - "force_download 参数传入后强制重新下载"
    - "DownloadConfig Pydantic 模型完整定义，config.yaml 校验通过"
    - "所有新增参数有合理默认值，不传参时行为与当前一致"
    - "所有新增测试通过"

risks:
  - level: "P1"
    description: "HF_TOKEN 泄露风险 - token 通过 API 请求传递时可能出现在日志中"
    mitigation: "API 日志中 token 字段脱敏（仅显示前4位），token 不存储到 DownloadTask 的 to_dict 输出中"
  - level: "P2"
    description: "ModelScope local_dir 参数兼容性 - 部分旧版本 modelscope 不支持 local_dir"
    mitigation: "先检查 modelscope 版本，不支持时降级到 cache_dir"
