taskId: AIOS-PRD-V2-UPGRADE
title: PRD全功能升级迭代 - 任务拆解
source: tech-solution.yaml

commands:
  test: "cd app-controller && python -m pytest tests/ -v && cd go-vllm-api && go test ./... -v"
  lint: "cd app-controller && python -m ruff check . && cd go-vllm-api && go vet ./..."
  typecheck: "cd go-vllm-api && go build ./..."

tasks:
  - id: T0-1
    type: test
    title: "OpenXLab 搜索/下载单元测试"
    priority: P0
    feature: F15/F16
    file: tests/test_model_hub_oxl.py
    test_coverage_checklist:
      - "_search_oxl() 返回正确格式"
      - "_download_oxl() 调用正确命令"
      - "聚合去重逻辑正确"
    given: "OpenXLab API 可用"
    when: "调用 search_models(source='oxl')"
    then:
      - "返回模型列表包含 model_name/source/path/size_b/quant"
      - "source='all' 时聚合 HF+MS+OXL 去重"

  - id: T0-2
    type: test
    title: "下载进度追踪单元测试"
    priority: P0
    feature: F15
    file: tests/test_download_progress.py
    test_coverage_checklist:
      - "HF 下载进度回调触发"
      - "progress_pct 从 0 渐进到 100"
      - "WS/SSE 推送进度更新"
    given: "HF 模型下载进行中"
    when: "snapshot_download 触发 progress_callback"
    then:
      - "progress_pct 中间值被记录"
      - "进度通过 WS/SSE 推送"

  - id: T0-3
    type: test
    title: "Token 限流单元测试"
    priority: P0
    feature: F3
    file: go-vllm-api/internal/service/rate_limiter_test.go
    test_coverage_checklist:
      - "TokenLimiter 计数正确"
      - "max_model_len 拦截生效"
      - "GPU>90% 降额生效"
    given: "Redis 可用且配置了限流规则"
    when: "请求输入 token 超过限制"
    then:
      - "返回 429 Too Many Requests"
      - "X-RateLimit-Remaining 正确反映额度"

  - id: P1-1
    type: code
    priority: P1
    feature: F15/F16
    title: "实现 OpenXLab 搜索/下载源"
    files:
      - app-controller/core/model_hub.py
      - app-controller/routes/model_hub.py
    depends_on:
      - T0-1
    definition_of_done:
      - "_search_oxl() 返回 OpenXLab 搜索结果 (model_name/source/path/size_b/quant)"
      - "_download_oxl() 调用 openxlab model download"
      - "search_models(source='oxl') 正常返回结果"
      - "search_models(source='all') 聚合 HF+MS+OXL 去重"

  - id: P1-2
    type: code
    priority: P1
    feature: F15
    title: "实现下载进度实时百分比推送"
    files:
      - app-controller/core/download_manager.py
      - app-controller/core/model_hub.py
    depends_on:
      - T0-2
    definition_of_done:
      - "HF下载过程中 progress_pct 从0渐进到100"
      - "progress_pct 中间值通过 WS/SSE 推送"
      - "snapshot_download 使用 tqdm callback 追踪进度"

  - id: P1-3
    type: code
    priority: P1
    feature: F15/F16
    title: "ModelScope resume_download + 搜索排序"
    files:
      - app-controller/core/model_hub.py
      - app-controller/routes/model_hub.py
    depends_on:
      - T0-1
    definition_of_done:
      - "MS下载使用 resume_download=True"
      - "search_models 支持 sort 参数 (size/quant/required_gb/feasible)"
      - "路由接口 /manage/models/search 支持 sort query param"

  - id: P0-1
    type: code
    priority: P0
    feature: F3
    title: "实现 Token 维度限流 + max_model_len 前置拦截"
    files:
      - go-vllm-api/internal/service/rate_limiter.go
      - go-vllm-api/internal/middleware/ratelimit.go
      - go-vllm-api/internal/handler/v1/chat.go
    depends_on:
      - T0-3
    definition_of_done:
      - "TokenLimiter: Redis key ratelimit:token:{ip} 60s窗口计数"
      - "chat.go: 输入token超max_model_len返回400"
      - "ratelimit.go: X-RateLimit-Remaining 精确反映窗口剩余额度"
      - "GPU显存>90%时限流阈值降低50%"

  - id: P1-4
    type: code
    priority: P1
    feature: F8
    title: "熔断阈值调整 + max_queue_size"
    files:
      - go-vllm-api/internal/proxy/vllm.go
      - go-vllm-api/internal/service/scheduler.go
    depends_on:
      - T0-3
    definition_of_done:
      - "NewCircuitBreaker(10, 5*time.Second)"
      - "scheduler.go: max_queue_size 超额立即返回429"
      - "/health/detailed 包含 circuit_breaker state"

  - id: P1-5
    type: code
    priority: P1
    feature: F12
    title: "配置 version + 乐观锁 + Go校验 + 操作日志"
    files:
      - app-controller/core/config.py
      - app-controller/core/config_watcher.py
      - app-controller/routes/manage.py
    depends_on:
      - T0-2
    definition_of_done:
      - "config.yaml 新增 version 字段"
      - "save_config() version自动递增"
      - "PUT /manage/config version不匹配返回409"
      - "Python配置变更后调用Go校验一致性"
      - "操作日志记录: operator/timestamp/before/after"

  - id: P1-6
    type: code
    priority: P1
    feature: F4
    title: "分级并发 + 30min超时 + 僵尸清理 + goroutine监控"
    files:
      - go-vllm-api/internal/service/scheduler.go
      - go-vllm-api/internal/config/watcher.go
    depends_on:
      - T0-3
    definition_of_done:
      - "config.yaml 新增 max_stream_concurrent 字段"
      - "scheduler: streamSlots 独立 semaphore"
      - "流式请求 context.WithTimeout 30min"
      - "zombieChecker 清理 idle>5min 流式连接"
      - "goroutine count 定期检查并告警"
