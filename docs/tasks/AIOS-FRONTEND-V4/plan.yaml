plan:
  meta:
    source_tech_doc: "docs/tasks/AIOS-FRONTEND-V4/tech-solution.yaml"
    scope: "P0"
    test_coverage_target: 100
    min_tests_per_feature: 1

  tasks:
    - id: "T0-1"
      priority: "P0"
      type: "test"
      title: "修复useSystemData单元测试mock"
      test_type: "pure"
      file: "frontend/src/composables/__tests__/useSystemData.test.ts"
      given: "useSystemData composable已定义，调用getSystemStatus+getHealthAlert+getSystemHistory"
      when: "refresh()调用后"
      then:
        - "systemStatus.value非null且包含cpu.percent=25"
        - "healthAlert.value非null且包含health_score=85"
        - "queueStatus.value为systemStatus.queue的计算值"
      depends_on: []

    - id: "P0-1"
      priority: "P0"
      type: "code"
      title: "修正useSystemData单元测试mock与实际调用对齐"
      files: ["frontend/src/composables/__tests__/useSystemData.test.ts"]
      depends_on: ["T0-1"]
      implementation_notes:
        - "添加getSystemHistory mock返回{history: [...]}"
        - "移除getQueueStatus mock（useSystemData不直接调用）"
        - "确保systemStatus mock数据包含queue字段"
      definition_of_done:
        - "vitest run全部通过（37/37 tests pass）"

    - id: "T0-2"
      priority: "P0"
      type: "test"
      title: "E2E测试断言与实际UI匹配验证"
      test_type: "view"
      file: "frontend/e2e/app.spec.ts"
      given: "前端dev server运行在localhost:30000"
      when: "playwright test执行"
      then:
