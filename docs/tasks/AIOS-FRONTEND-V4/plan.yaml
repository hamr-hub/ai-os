        - "所有卡片视觉一致性确认"

  commands:
    test: "cd frontend && npx vitest run"
    lint: "cd frontend && git diff --name-only HEAD | grep '\\.ts$\\|\\.vue$' | head -20 | xargs npx eslint --no-error-on-unmatched-pattern 2>/dev/null || true"
    typecheck: "cd frontend && npx vue-tsc --noEmit"
