      implementation_notes:
        - "model-list-card → running-card"
        - "/chat路由 → /agent路由"
        - ".chat-view → .agent-view或其他实际类名"
        - ".new-chat-btn → 检查AgentView实际类名"
        - "sidebar宽度220px → 240px"
        - "中屏断点1000px → 768px"
        - "model-mgmt选择器确认"
      definition_of_done:
        - "playwright test全部通过（无定位器错误）"

