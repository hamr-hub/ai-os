meta:
  title: "多源下载+模型搜索+显存优选+引擎管理+模型池"
  platform: "backend_python+frontend_vue"
  version: "1.0"
  requirement_version: "1.3"
  requirement_confidence: "high"
  business_goal: "实现大模型全生命周期管理: 从搜索发现→显存优选→多源下载→引擎加载→统一调度"

scope:
  in_scope:
    - "6个Python核心模块(GPUMemoryManager/MultiSourceModelHub/DownloadTaskManager/ModelPoolManager/LLMServiceManager/ModelEngineScheduler)"
    - "11个新增API路由(搜索/下载/模型池/显存优选)"
    - "Go网关11个代理路由"
    - "2个前端新页面(ModelSearchView/ModelPoolView)+7组件+3composables"
    - "WebSocket /ws/download 频道"
    - "config.yaml engines/download配置段扩展"
    - "model_switch_orchestrator Phase2.5显存校验集成"
  out_of_scope:
    - "JWT鉴权/RBAC(已在PRD第7.6节规划,本次不实现)"
    - "OpenTelemetry对接(已在架构风险规划)"
    - "Go多实例+Nginx负载均衡(高可用规划)"
    - "删除旧模块sys_ctl.py(Phase 12,低优先级)"
    - "SGLang引擎命令行参数详细适配(Phase 6,基础支持先实现)"

global_constraints:
  - "torch.cuda优先,不可用时降级nvidia-smi(误差<5%)"
  - "subprocess.Popen进程管理,可降级回systemd(config开关)"
  - "ModelScope首选下载源(国内速度最快)"
  - "新增模块独立可插拔,旧模块保留,config开关降级"
  - "85%显存安全水位线,启动前校验"
  - "85%磁盘水位告警,95%终止下载"
  - "max_concurrent_downloads=3并发下载限制"

file_changes:
  - path: "app-controller/core/gpu_memory_manager.py"
    change: "add"
    summary: "GPU显存精准检测+模型显存估算+可行性校验(torch.cuda+nvidia-smi降级)"
    risk: "low"
    depends_on: ["app-controller/core/monitor.py"]

  - path: "app-controller/core/model_hub.py"
    change: "add"
    summary: "多源模型搜索+下载(HuggingFace/ModelScope/OpenXLab)"
    risk: "medium"
    depends_on: ["app-controller/core/gpu_memory_manager.py"]

  - path: "app-controller/core/download_manager.py"
    change: "add"
    summary: "下载任务生命周期管理(创建/进度/取消/完成回调/磁盘校验)"
    risk: "medium"
    depends_on: ["app-controller/core/model_hub.py", "app-controller/core/model_pool.py"]

  - path: "app-controller/core/model_pool.py"
    change: "add"
    summary: "模型池统一管理(下载入库/本地扫描同步/查询/加载/删除/配置同步)"
    risk: "medium"
    depends_on: ["app-controller/core/gpu_memory_manager.py"]

  - path: "app-controller/core/llm_service_manager.py"
    change: "add"
    summary: "统一引擎进程管理(subprocess.Popen替代systemd,支持vLLM+SGLang)"
    risk: "high"
    implementation_notes:
      - "进程管理稳定性不如systemd,需3次自动重启兜底"
      - "config开关engine_manager_mode可降级回systemd"

  - path: "app-controller/core/model_engine_scheduler.py"
    change: "add"
    summary: "终极调度中心(显存优选+搜索下载+模型池+引擎切换统一入口)"
    risk: "medium"
    depends_on: ["app-controller/core/gpu_memory_manager.py", "app-controller/core/model_hub.py", "app-controller/core/model_pool.py", "app-controller/core/llm_service_manager.py"]

  - path: "app-controller/routes/manage.py"
    change: "modify"
    summary: "新增11个管理路由(搜索/下载/模型池/显存优选/显存校验)"
    risk: "low"

  - path: "app-controller/routes/websocket.py"
    change: "modify"
    summary: "新增/ws/download WebSocket频道"
    risk: "low"

  - path: "app-controller/core/deps.py"
    change: "modify"
    summary: "注册6个新模块单例(GPUMemoryManager/MultiSourceModelHub/DownloadTaskManager/ModelPoolManager/LLMServiceManager/ModelEngineScheduler)"
    risk: "low"

  - path: "app-controller/requirements.txt"
    change: "modify"
    summary: "新增5个依赖(huggingface-hub/modelscope/openxlab/torch/psutil)"
    risk: "medium"

  - path: "app-controller/core/model_switch_orchestrator.py"
    change: "modify"
    summary: "新增Phase2.5显存校验(GPUMemoryManager.check_model_feasibility),调用LLMServiceManager替代sys_ctl"
    risk: "high"
    implementation_notes:
      - "修改核心切换流程,需确保回滚机制不受影响"

  - path: "app-controller/core/scheduler.py"
    change: "modify"
    summary: "调用ModelPoolManager获取模型信息,与模型池协调"
    risk: "medium"

  - path: "app-controller/config.yaml"
    change: "modify"
    summary: "新增engines/download配置段,模型增加engine_type/source字段"
    risk: "low"

  - path: "go-vllm-api/internal/handler/manage/manage.go"
    change: "modify"
    summary: "新增11个代理路由(搜索/下载/模型池/显存优选/显存校验→转发Python)"
    risk: "low"

  - path: "go-vllm-api/internal/config/config.go"
    change: "modify"
    summary: "新增EnginesConfig/DownloadConfig结构体"
    risk: "low"

  - path: "frontend/src/views/ModelSearchView.vue"
    change: "add"
    summary: "模型搜索+下载+显存优选页面(搜索输入/结果列表/推荐面板/下载进度)"
    risk: "medium"
    depends_on: ["frontend/src/api/client.ts", "frontend/src/types/index.ts"]

  - path: "frontend/src/views/ModelPoolView.vue"
    change: "add"
    summary: "模型池管理页面(列表/详情/加载/删除)"
    risk: "medium"
    depends_on: ["frontend/src/api/client.ts"]

  - path: "frontend/src/components/SearchBar.vue"
    change: "add"
    summary: "搜索输入+平台选择+limit设置组件"
    risk: "low"

  - path: "frontend/src/components/SearchResultList.vue"
    change: "add"
    summary: "搜索结果列表(含显存可行性标注✅❌)"
    risk: "low"

  - path: "frontend/src/components/RecommendPanel.vue"
    change: "add"
    summary: "显存优选推荐面板(可用显存+推荐最优模型)"
    risk: "low"

  - path: "frontend/src/components/DownloadProgress.vue"
    change: "add"
    summary: "下载进度条(百分比/速度/ETA/取消)"
    risk: "low"

  - path: "frontend/src/components/ModelPoolPanel.vue"
    change: "add"
    summary: "模型池面板(已下载模型+加载状态)"
    risk: "low"

  - path: "frontend/src/composables/useModelSearch.ts"
    change: "add"
    summary: "搜索+显存优选推荐composable"
    risk: "low"

  - path: "frontend/src/composables/useModelDownload.ts"
    change: "add"
    summary: "下载任务管理composable(创建/进度/取消)"
    risk: "low"

  - path: "frontend/src/composables/useModelPool.ts"
    change: "add"
    summary: "模型池composable(列表/加载/删除)"
    risk: "low"

  - path: "frontend/src/api/client.ts"
    change: "modify"
    summary: "新增11个API方法(searchModels/recommendModel/checkModelMemory/startDownload/getDownloadStatus/cancelDownload/listDownloads/getPoolList/getPoolDetail/loadFromPool/deleteFromPool)"
    risk: "low"

  - path: "frontend/src/types/index.ts"
    change: "modify"
    summary: "新增4个类型定义(SearchResult/RecommendResult/DownloadTask/PoolEntry)"
    risk: "low"

  - path: "frontend/src/router/index.ts"
    change: "modify"
    summary: "新增/search和/pool路由"
    risk: "low"

