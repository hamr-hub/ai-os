    change: "modify"
    summary: "新增2个菜单项(模型搜索/模型池)"
    risk: "low"

api:
  - name: "searchModels"
    layer: "backend"
    endpoint: "/manage/models/search"
    method: "GET"
    request_schema:
      keyword: "string"
      source: "string"  # modelscope/huggingface/openxlab/all
      limit: "number?"
    response_schema:
      results: "SearchResult[]"
      total: "number"
    error_codes:
      - code: "400"
        meaning: "缺少keyword参数"
        handling: "返回错误提示"
      - code: "503"
        meaning: "指定平台SDK不可用"
        handling: "返回降级提示,建议切换平台"

  - name: "recommendModel"
    layer: "backend"
    endpoint: "/manage/gpu/recommend"
    method: "GET"
    request_schema:
      keyword: "string"
      source: "string?"
    response_schema:
      recommended: "SearchResult"
      gpu_info: "GPUInfo"
      candidates: "SearchResult[]"
    error_codes:
      - code: "400"
        meaning: "缺少keyword参数"
        handling: "返回错误提示"
      - code: "503"
        meaning: "GPU不可用(torch.cuda/nvidia-smi均失败)"
        handling: "返回无法检测显存提示"

  - name: "checkModelMemory"
    layer: "backend"
    endpoint: "/manage/gpu/memory-check/{model_name}"
    method: "POST"
    request_schema:
      model_name: "string"
    response_schema:
      feasible: "boolean"
      available_gb: "number"
      required_gb: "number"
      safety_margin_gb: "number"
      suggested_models: "string[]"
    error_codes:
      - code: "404"
        meaning: "模型不存在"
        handling: "返回模型不存在提示"
      - code: "503"
        meaning: "GPU检测失败"
        handling: "降级到配置required_memory字段"

  - name: "startDownload"
    layer: "backend"
    endpoint: "/manage/models/download"
    method: "POST"
    request_schema:
      model_name: "string"
      source: "string"  # hf/ms/oxl
      save_dir: "string?"
    response_schema:
      task_id: "string"
      status: "string"
    error_codes:
      - code: "400"
        meaning: "缺少model_name/source参数"
        handling: "返回参数错误提示"
      - code: "409"
        meaning: "模型已存在(无需下载)"
        handling: "返回已有模型路径"
      - code: "507"
        meaning: "磁盘空间不足(>95%水位)"
        handling: "返回磁盘不足告警"

  - name: "getDownloadStatus"
    layer: "backend"
    endpoint: "/manage/models/download/{task_id}/status"
    method: "GET"
    request_schema:
      task_id: "string"
    response_schema:
      task_id: "string"
      status: "string"  # pending/downloading/completed/failed/cancelled
      progress_pct: "number"
      speed_mbps: "number"
      eta_seconds: "number"
      downloaded_bytes: "number"
      total_bytes: "number"
    error_codes:
      - code: "404"
        meaning: "任务不存在"
        handling: "返回任务不存在提示"

  - name: "cancelDownload"
    layer: "backend"
    endpoint: "/manage/models/download/{task_id}"
    method: "DELETE"
    request_schema:
      task_id: "string"
    response_schema:
      cancelled: "boolean"
    error_codes:
      - code: "404"
        meaning: "任务不存在"
        handling: "返回任务不存在提示"

  - name: "getPoolList"
    layer: "backend"
    endpoint: "/manage/models/pool"
    method: "GET"
    request_schema:
      filter: "string?"  # all/local/downloaded
      page: "number?"
      page_size: "number?"
    response_schema:
      models: "PoolEntry[]"
      total: "number"
    error_codes:
      - code: "500"
        meaning: "模型池加载失败"
        handling: "返回内部错误"

  - name: "poolLoad"
    layer: "backend"
    endpoint: "/manage/models/pool/{model_key}/load"
    method: "POST"
    request_schema:
      model_key: "string"
      engine: "string?"  # vllm/sglang
    response_schema:
      success: "boolean"
      model: "string"
      engine: "string"
      port: "number"
    error_codes:
      - code: "404"
        meaning: "模型不在池中"
        handling: "返回模型不存在"
      - code: "409"
        meaning: "显存不足"
        handling: "返回显存不足告警+建议可运行模型"
      - code: "409"
        meaning: "模型正在运行"
        handling: "返回当前运行状态"

  - name: "poolDelete"
    layer: "backend"
    endpoint: "/manage/models/pool/{model_key}"
    method: "DELETE"
    request_schema:
      model_key: "string"
      remove_files: "boolean?"
    response_schema:
      deleted: "boolean"
    error_codes:
      - code: "404"
        meaning: "模型不在池中"
        handling: "返回模型不存在"
      - code: "409"
        meaning: "模型正在运行,无法删除"
        handling: "返回运行状态提示"

validation:
  acceptance:
    - criteria: "GET /manage/models/search?keyword=qwen&source=modelscope 返回搜索结果列表含size_b/quant/required_gb/feasible字段"
      test_type: "integration"
      priority: "P0"

    - criteria: "GET /manage/gpu/recommend?keyword=qwen&source=modelscope 返回推荐最优模型+GPU信息+候选列表"
      test_type: "integration"
      priority: "P0"

    - criteria: "POST /manage/gpu/memory-check/Qwen2.5-7B-Instruct 返回feasible/available_gb/required_gb/safety_margin_gb"
      test_type: "integration"
      priority: "P0"

    - criteria: "POST /manage/models/download 启动下载任务,返回task_id,WebSocket推送进度"
      test_type: "integration"
      priority: "P1"

    - criteria: "GET /manage/models/download/{task_id}/status 返回进度百分比/速度/剩余时间"
      test_type: "integration"
      priority: "P1"

    - criteria: "DELETE /manage/models/download/{task_id} 取消下载任务"
      test_type: "integration"
      priority: "P1"

    - criteria: "GET /manage/models/pool 返回模型池列表含来源/大小/量化/显存/本地路径/下载状态"
      test_type: "integration"
      priority: "P0"

    - criteria: "POST /manage/models/pool/{key}/load 一键加载:显存校验→引擎启动→验证就绪"
      test_type: "integration"
      priority: "P1"

    - criteria: "torch.cuda不可用时自动降级nvidia-smi检测,误差<5%"
      test_type: "unit"
      priority: "P0"

    - criteria: "显存估算: 4bit=参数×0.7GB/8bit=×1.1GB/fp16=×2.0GB + 1GB冗余"
      test_type: "unit"
      priority: "P0"

    - criteria: "搜索→下载→加载一键链路:搜索结果→下载→入库→显存校验→引擎启动→验证就绪"
      test_type: "integration"
      priority: "P1"

    - criteria: "断点续传:下载中断后resume_download=True自动续传"
      test_type: "integration"
      priority: "P1"

    - criteria: "磁盘空间校验:85%告警/95%终止下载"
      test_type: "unit"
      priority: "P1"

    - criteria: "前端ModelSearchView页面:搜索→推荐→下载→加载完整交互"
      test_type: "manual"
      priority: "P1"

    - criteria: "前端ModelPoolView页面:列表→加载→删除完整交互"
      test_type: "manual"
      priority: "P1"

risks:
  - level: "P0"
    description: "subprocess.Popen进程管理不如systemd稳定,引擎异常退出时无守护"
    mitigation: "3次自动重启兜底; config开关engine_manager_mode可降级回systemd"

  - level: "P0"
    description: "model_switch_orchestrator修改核心切换流程(Phase2.5),可能影响回滚机制"
    mitigation: "双轨并行验证期; Phase2.5失败时直接跳过(不影响后续Phase); 配置开关控制是否启用显存校验"

  - level: "P1"
    description: "torch.cuda依赖冲突导致GPUMemoryManager无法加载"
    mitigation: "降级到nvidia-smi解析(<5%误差可接受); try-except导入torch"

  - level: "P1"
    description: "HF/MS/OXL SDK版本不兼容导致下载/搜索功能异常"
    mitigation: "各SDK独立版本锁定requirements.txt; 异常时降级到单一平台; 搜索失败返回503+建议切换平台"

  - level: "P1"
    description: "SGLang命令行参数与vLLM不兼容,引擎切换后参数丢失"
    mitigation: "引擎类型→参数模板映射; config.yaml sglang_params独立配置; build_command()引擎适配"

  - level: "P2"
    description: "大模型下载速度慢,用户体验差"
    mitigation: "ModelScope首选(国内最快); HF镜像加速; 显示速度+ETA; WebSocket实时推送进度"
