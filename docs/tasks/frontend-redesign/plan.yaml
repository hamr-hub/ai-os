plan:
  meta:
    source_tech_doc: "docs/tasks/frontend-redesign/tech-solution.yaml"
    scope: "P0+P1"
    test_coverage_target: 80
    min_tests_per_feature: 2
    mode: standard

  tasks:
    - id: "T0-1"
      priority: "P0"
      type: "test"
      title: "useModelSwitch Phase2.5显存校验单元测试"
      test_type: "hook"
      file: "frontend/src/composables/__tests__/useModelSwitch.test.ts"
      given: "引擎切换WebSocket推送含phase2.5显存校验步骤"
      when: "监听switch_progress消息"
      then:
        - "phase2.5状态从pending→running→success/failed正确映射"
        - "显存不足时phase2.5状态为failed并触发rollback"
        - "overall_progress含phase2.5进度百分比"
      depends_on: []

    - id: "P0-1"
      priority: "P0"
      type: "code"
      title: "useModelSwitch添加Phase2.5显存校验步骤支持"
      files: ["frontend/src/composables/useModelSwitch.ts", "frontend/src/types/index.ts"]
      depends_on: ["T0-1"]
      definition_of_done:
        - "SwitchPhaseDetail支持phase2.5显存校验步骤"
        - "WebSocket消息解析含phase2.5进度"
        - "对应单元测试通过"
        - "pnpm build通过"

