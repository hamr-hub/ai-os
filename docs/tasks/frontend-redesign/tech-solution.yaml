api:
  - name: "getEngineStatus"
    layer: frontend
    endpoint: "/manage/engine/status"
    method: "GET"
    request_schema: {}
    response_schema:
      vllm: "EngineDetail"
      sglang: "EngineDetail"
      llama_cpp: "EngineDetail"
      current_engine: "EngineType"
    error_codes:
      - code: "500"
        meaning: "后端不可用"
        handling: "空状态+重试按钮"
    timeout_ms: 5000
  - name: "switchEngine"
    layer: frontend
    endpoint: "/manage/engine/switch"
    method: "POST"
    request_schema:
      model_name: "string"
      engine_type: "EngineType"
      port: "number"
    response_schema:
      status: "string"
      session_id: "string?"
    error_codes:
      - code: "409"
        meaning: "切换进行中"
        handling: "提示等待当前切换完成"
      - code: "503"
        meaning: "显存不足"
        handling: "红色告警+建议可运行模型"
    timeout_ms: 30000
  - name: "searchModels"
    layer: frontend
    endpoint: "/manage/models/search"
    method: "GET"
    request_schema:
      keyword: "string"
      source: "string"
      limit: "number"
    response_schema:
      results: "SearchResult[]"
      total: "number"
    error_codes:
      - code: "500"
        meaning: "搜索服务异常"
        handling: "空状态+重试"
    timeout_ms: 10000
  - name: "recommendModel"
    layer: frontend
    endpoint: "/manage/gpu/recommend"
    method: "GET"
    request_schema:
      keyword: "string"
      source: "string"
    response_schema:
      recommended: "SearchResult?"
      gpu_info: "GPURecommendInfo"
      candidates: "SearchResult[]"
    error_codes:
      - code: "500"
        meaning: "GPU检测失败"
        handling: "降级nvidia-smi+提示"
    timeout_ms: 5000
  - name: "checkModelMemory"
    layer: frontend
    endpoint: "/manage/gpu/memory-check/:model"
    method: "POST"
    request_schema: {}
    response_schema:
      feasible: "boolean"
      available_gb: "number"
      required_gb: "number"
    error_codes:
      - code: "404"
        meaning: "模型不存在"
        handling: "提示模型名错误"
      - code: "503"
        meaning: "显存不足"
        handling: "告警+建议列表"
    timeout_ms: 5000
  - name: "startDownload"
    layer: frontend
    endpoint: "/manage/models/download"
    method: "POST"
    request_schema:
      model_name: "string"
      source: "string"
      save_dir: "string?"
    response_schema:
      task_id: "string"
      status: "string"
    error_codes:
      - code: "409"
        meaning: "下载任务已存在"
        handling: "提示跳转到下载进度"
      - code: "500"
        meaning: "磁盘空间不足"
        handling: "告警+终止"
    timeout_ms: 10000
  - name: "loadFromPool"
    layer: frontend
    endpoint: "/manage/models/pool/:key/load"
    method: "POST"
    request_schema:
      engine: "string"
    response_schema:
      success: "boolean"
      model: "string"
      engine: "string"
      port: "number"
    error_codes:
      - code: "503"
        meaning: "显存不足"
        handling: "拒绝加载+告警+建议列表"
      - code: "409"
        meaning: "模型正在加载"
        handling: "提示等待"
    timeout_ms: 30000
  - name: "getEngineConfig"
    layer: frontend
    endpoint: "/engines/config"
    method: "GET"
    request_schema: {}
    response_schema:
      vllm: "EngineConfigDetail"
      sglang: "EngineConfigDetail"
      llama_cpp: "EngineConfigDetail"
    error_codes:
      - code: "500"
        meaning: "后端不可用"
        handling: "空状态"
    timeout_ms: 5000
  - name: "updateEngineConfig"
    layer: frontend
    endpoint: "/engines/config"
    method: "PUT"
    request_schema:
      vllm: "EngineConfigDetail?"
      sglang: "EngineConfigDetail?"
    response_schema:
      vllm: "EngineConfigDetail"
      sglang: "EngineConfigDetail"
    error_codes:
      - code: "400"
        meaning: "配置格式错误"
        handling: "Toast提示+保持原值"
      - code: "500"
        meaning: "后端保存失败"
        handling: "Toast提示+重试"
    timeout_ms: 5000

validation:
  acceptance:
    - ac: "AC-1"
      test: "引擎面板切换到SGLang，显示4阶段进度含Phase2.5显存校验，完成后SGLang运行"
      files: ["frontend/src/views/ModelManagement.vue", "frontend/src/components/EngineSwitchPanel.vue", "frontend/src/composables/useModelSwitch.ts"]
    - ac: "AC-2"
      test: "输入关键词搜索，结果含可行性徽章，下载时WS实时进度展示"
      files: ["frontend/src/views/ModelHubPage.vue", "frontend/src/composables/useModelSearch.ts", "frontend/src/composables/useModelDownload.ts"]
    - ac: "AC-3"
      test: "点击显存优选，筛选可运行模型+推荐最优"
      files: ["frontend/src/views/ModelHubPage.vue", "frontend/src/composables/useGPUMemory.ts"]
    - ac: "AC-4"
      test: "模型池一键加载，显存校验→引擎启动→就绪验证"
      files: ["frontend/src/views/ModelPoolPage.vue", "frontend/src/composables/useModelPool.ts"]
    - ac: "AC-5"
      test: "Dashboard GPU利用率>85%时可用显存红色告警标识"
      files: ["frontend/src/views/Dashboard.vue", "frontend/src/components/cards/GpuMetricsCard.vue"]
    - ac: "AC-6"
      test: "模型管理页显示引擎状态+切换面板+Phase2.5"
      files: ["frontend/src/views/ModelManagement.vue", "frontend/src/composables/useEngineManagement.ts"]
  test_strategy:
    framework: "vitest"
    commands:
      - "cd frontend && pnpm test"
      - "cd frontend && pnpm build"

risks:
  - level: P1
    description: "ModelManagement.vue已达3791行，新增功能可能加剧膨胀"
    mitigation: "抽取EngineSwitchPanel为独立子组件，功能内聚不拆分主文件"
  - level: P1
    description: "useGPUMemory Ref模板类型推导需解构"
    mitigation: "所有使用处解构为顶层ref，已在上一轮验证"
  - level: P2
    description: "WS连接断开时下载进度丢失"
    mitigation: "降级3s轮询+状态指示灯(绿→黄→红)"
  - level: P2
    description: "多下载并行时任务管理复杂"
    mitigation: "P2优先级，后续版本添加队列管理UI"

open_questions: []
