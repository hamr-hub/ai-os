  frontend:
    framework: "Vue 3.5 + TypeScript"
    styling: "Tailwind CSS 4"
    state_management: "Pinia 3"
    router: "Vue Router 5"
  
  backend:
    framework: "FastAPI + Python 3.11+"
    config_format: "YAML"
    logging: "Python logging"
    redis_client: "redis-py"
  
  existing_patterns:
