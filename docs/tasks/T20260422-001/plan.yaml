tests:
  - id: TEST-001
    priority: P0
    target: app-controller/core/config.py
    type: unit
    given: "环境变量 REDIS_HOST=custom.redis.host 且 REDIS_PORT=6380"
    when: "加载配置"
    then: "config.redis_host == 'custom.redis.host' 且 config.redis_port == 6380"
  
  - id: TEST-002
    priority: P0
    target: app-controller/core/config.py
    type: unit
    given: "config.yaml 中 redis.host= yaml.host, redis.port=6380"
    when: "加载配置（无环境变量）"
    then: "config.redis_host == 'yaml.host' 且 config.redis_port == 6380"
  
  - id: TEST-003
    priority: P0
    target: app-controller/core/config.py
    type: unit
    given: "无环境变量且无配置文件 redis 字段"
    when: "加载配置"
    then: "config.redis_host == 'localhost' 且 config.redis_port == 6379"
  
  - id: TEST-004
    priority: P0
    target: app-controller/core/redis_client.py
    type: unit
    given: "Redis 服务不可用"
    when: "尝试连接"
    then: "返回 False 且不影响其他功能"
  
  - id: TEST-005
    priority: P1
    target: frontend/src/style.css
    type: build
    given: "前端项目存在"
    when: "执行 pnpm build"
    then: "编译成功无错误"
  
  - id: TEST-006
    priority: P0
    target: app-controller/scripts/mock_vllm_server.py
    type: integration
    given: "Mock 服务运行在 8000 端口"
    when: "请求 /v1/models"
    then: "返回包含 mock 模型列表"
  
  - id: TEST-007
    priority: P0
    target: 整体系统
    type: e2e
    given: "前后端服务均已启动"
    when: "访问前端首页"
    then: "页面正常渲染，无控制台报错"

