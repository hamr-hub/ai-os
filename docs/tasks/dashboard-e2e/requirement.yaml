task_id: dashboard-e2e
title: Dashboard功能完善 + 端到端测试
source: 用户需求
developer: heyongxian
created_at: "2026-04-23"

requirements:
  - id: R1
    title: Dashboard新增系统状态卡片
    priority: P0
    description: |
      在Dashboard页面新增"系统状态"卡片，展示CPU/内存/磁盘使用率。
      后端已有 /manage/system/status 接口返回 system_status 数据。
      需要新增API调用函数、类型定义和Dashboard卡片组件。
    ac:
      - AC1.1: Dashboard页面显示系统状态卡片，包含CPU使用率、内存使用率、磁盘使用率
      - AC1.2: 数据从 /manage/system/status 接口获取
      - AC1.3: 各指标有对应的进度条和颜色阈值（70% warning, 90% danger）
      - AC1.4: 数据随Dashboard刷新按钮一起刷新，10秒自动轮询

  - id: R2
    title: Dashboard新增队列状态卡片
    priority: P0
    description: |
      在Dashboard页面新增"请求队列"卡片，展示各模型请求队列情况。
      后端已有 /manage/queue 接口返回 queue 数据。
    ac:
      - AC2.1: Dashboard页面显示请求队列卡片，展示每个运行模型的队列请求数
      - AC2.2: 数据从 /manage/queue 接口获取
      - AC2.3: 队列有请求时显示warning状态标记
      - AC2.4: 数据随Dashboard刷新按钮一起刷新，10秒自动轮询

  - id: R3
    title: Dashboard新增健康告警卡片
    priority: P1
    description: |
      在Dashboard页面新增"健康告警"卡片，展示系统健康状态和告警信息。
      后端已有 /manage/health/alert 接口。
    ac:
      - AC3.1: Dashboard页面显示健康告警卡片，包含健康状态(healthy/degraded/unhealthy)和告警列表
      - AC3.2: 数据从 /manage/health/alert 接口获取
      - AC3.3: 不同状态显示不同颜色标记（healthy=green, degraded=yellow, unhealthy=red）
      - AC3.4: 告警信息可展开查看详情

  - id: R4
    title: Dashboard使用useTokenStats composable
    priority: P1
    description: |
      Dashboard当前直接调用getTokenStats/getGPUHistory，重复了useTokenStats composable的逻辑。
      应改为使用useTokenStats composable以统一数据获取和状态管理。
    ac:
      - AC4.1: Dashboard使用useTokenStats composable获取token数据
      - AC4.2: 移除Dashboard中重复的tokenStats/fetchTokenStats/格式化函数
      - AC4.3: Dashboard仍使用GPU history直接调用（因为useGPU不含history逻辑）

  - id: R5
    title: Dashboard加载状态和错误处理
    priority: P0
    description: |
      Dashboard当前所有API catch块都静默吞错误，无loading状态指示。
      需要添加加载骨架屏/-spinner和错误提示UI。
    ac:
      - AC5.1: 首次加载时各卡片显示loading骨架屏
      - AC5.2: API调用失败时显示错误提示（可重试）
      - AC5.3: 使用Toast通知关键操作失败（模型启动/停止/切换）

  - id: R6
    title: Dashboard响应式布局优化
    priority: P1
    description: |
      当前Dashboard grid固定2列，在窄屏下体验差。
      需要根据屏幕宽度自适应列数。
    ac:
      - AC6.1: 宽屏(>1200px)显示3列
      - AC6.2: 中屏(768-1200px)显示2列
      - AC6.3: 窄屏(<768px)显示1列

  - id: R7
    title: 添加Playwright E2E测试框架
    priority: P0
    description: |
      前端当前零测试。需要搭建Playwright端到端测试框架，
      编写核心Dashboard页面的E2E测试。
    ac:
      - AC7.1: 安装Playwright并配置测试环境
      - AC7.2: 编写Dashboard页面加载和渲染测试
      - AC7.3: 编写Dashboard数据展示测试（GPU/Token/模型列表）
      - AC7.4: 编写Dashboard交互测试（刷新按钮/模型操作）
      - AC7.5: 编写导航跳转测试
      - AC7.6: 配置package.json test脚本

  - id: R8
    title: 添加Vitest单元测试框架
    priority: P1
    description: |
      为composables和stores添加Vitest单元测试。
    ac:
      - AC8.1: 安装vitest和@vue/test-utils
      - AC8.2: 编写useTokenStats composable测试
      - AC8.3: 编写useGPU composable测试
      - AC8.4: 编写useModels composable测试
      - AC8.5: 编写app store测试
