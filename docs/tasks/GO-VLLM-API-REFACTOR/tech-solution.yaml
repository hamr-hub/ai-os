# app-controller Python → go-vllm-api Go 重构技术方案

## 项目概述

将 Python FastAPI 后端 app-controller 重构为 Go Gin 后端 go-vllm-api，实现 API 端点完全对齐、OpenAI API 兼容性增强、Redis 缓存和限流接入。

## 架构对照

```
Python                          Go
─────────────                   ─────────
FastAPI + Uvicorn               Gin + net/http
redis.asyncio                   go-redis/v9
watchdog                        fsnotify
httpx.AsyncClient               http.Client
pydantic BaseModel              Go struct + yaml tag
asyncio                         goroutine + context
```

