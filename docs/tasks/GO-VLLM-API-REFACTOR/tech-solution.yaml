## 风险评估

| 风险项 | 等级 | 处理策略 |
|--------|------|----------|
| Redis 不可用 | LOW | CacheService/RateLimiter 自动降级到内存 |
| GPU 监控失败 | MEDIUM | nvidia-smi 不可用时返回 unavailable |
| 流式 SSE 代理 | MEDIUM | 已实现 heartbeat + scanner |
