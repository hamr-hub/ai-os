[pytest]
testpaths = tests
addopts = -v --tb=short -m "not integration and not e2e"
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
cache_dir = .pytest_cache
log_cli = true
log_cli_level = INFO
markers =
    integration: requires running ai-os services or external localhost endpoints
    e2e: end-to-end checks that require the full stack
