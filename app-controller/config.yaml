settings:
  concurrency_limit: 32
  min_available_memory: 4GB
  request_timeout: 120
  model_start_timeout: 120
  preload_timeout: 300
  idle_timeout: 600
  memory_flush_interval: 300
  memory_cleanup_delay: 5
  gpu_memory_utilization: 0.92
  default_memory_strategy: balanced

  redis:
    host: 127.0.0.1
    port: 6379
    db: 5

  logging:
    log_dir: logs
  
  queue:
    max_length: 100
    poll_interval: 0.5
    wait_timeout: 30
  
  priority:
    default: normal
    enabled: true
  
  recovery:
    max_restart_attempts: 3
    restart_cooldown: 60
    watchdog_check_interval: 5

vllm:
  service_name: vllm-aiclient
  start_script: /root/ai-os/app-controller/scripts/start_vllm_aiclient.sh
  model_base_path: /mnt/pve_models
  default_port: 8000
  backend_base_url: ""
  health_url: ""
  default_gpu_memory_utilization: 0.92
  default_max_model_len: 32768
  model_state_file: /root/ai-os/app-controller/scripts/.vllm_model_path
  hf_endpoint: "https://hf-mirror.com"
  engine_manager_mode: subprocess
  venv_path: /root/ai-suite/vllm_env
  env_vars:
    VLLM_USE_V1: "1"
    NCCL_P2P_DISABLE: "1"
    NCCL_SOCKET_REUSEPORT: "1"
    NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_IB_DISABLE: "1"
    CUDA_MANAGED_FORCE_DEVICE_ALLOC: "1"
    OMP_NUM_THREADS: "16"
    VLLM_NO_FLASHINFER: "1"
    FLASHINFER_DISABLE: "1"
  health_check_interval: 5

engines:
  sglang:
    default_port: 8100
    default_gpu_memory_utilization: 0.90
    default_max_model_len: 32768
  hub:
    save_root: /mnt/pve_models
    hf_endpoint: "https://hf-mirror.com"
    sources:
      - local
      - huggingface
      - modelscope

feature_flags:
  multi_engine_enabled: true
  sse_push_enabled: true
  agent_command_enabled: true
  download_resume_enabled: true
  agent_blocked_commands:
    - rm
    - shutdown
    - reboot
    - mkfs
