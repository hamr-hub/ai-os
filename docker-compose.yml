version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: ai-os-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-controller:
    build: ./app-controller
    container_name: ai-os-controller
    ports:
      - "5000:5000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./app-controller/logs:/app/logs
      - /mnt/pve_models:/mnt/pve_models
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  aiclient:
    image: justlikemaki/aiclient-2-api:latest
    container_name: ai-os-aiclient
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./aiclient2api/data:/app/data
      - ./aiclient2api/configs:/configs
    depends_on:
      - ai-controller
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: ai-os-network