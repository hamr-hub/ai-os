services:
  redis:
    image: redis:7.2-alpine
    container_name: ai-os-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-controller:
    build:
      context: ./app-controller
      dockerfile: Dockerfile
    container_name: ai-os-controller
    ports:
      - "35000:35000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./app-controller/logs:/app/logs
      - /mnt/pve_models:/mnt/pve_models
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - PORT=35000
      - HOST=0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:35000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  go-vllm-api:
    build:
      context: ./go-vllm-api
      dockerfile: Dockerfile
    container_name: ai-os-go-vllm-api
    ports:
      - "35001:35001"
    volumes:
      - ./config.yaml:/app/config.yaml
      - /mnt/pve_models:/mnt/pve_models
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PORT=35001
      - PYTHON_BACKEND_URL=http://ai-controller:35000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  aiclient:
    image: justlikemaki/aiclient-2-api:latest
    container_name: ai-os-aiclient
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GO_BACKEND_URL=http://go-vllm-api:35001
      - PYTHON_BACKEND_URL=http://ai-controller:35000
    volumes:
      - ./aiclient2api/data:/app/data
      - ./aiclient2api/configs:/app/configs
    depends_on:
      ai-controller:
        condition: service_healthy
      go-vllm-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-os-frontend
    ports:
      - "30000:80"
    depends_on:
      aiclient:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  default:
    name: ai-os-network
    driver: bridge
