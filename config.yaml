app_controller:
  admin_whitelist:
    allowed_ips:
    - 127.0.0.1
    - ::1
    block_write_non_whitelist: true
    enabled: true
  cors_origins:
  - http://localhost:30001
  - http://localhost:30000
  host: 0.0.0.0
  port: 35000
  websocket:
    enabled: true
    path: /ws
    ping_interval: 30
    ping_timeout: 10
discovery:
  auto_discover: true
  priority: scan_first
engines:
  hub:
    hf_endpoint: https://hf-mirror.com
    save_root: /mnt/pve_models
    sources:
    - local
    - huggingface
    - modelscope
  llamacpp:
    default_port: 8001
    enabled: true
    venv_path: /root/ai-os/venvs/llamacpp
  sglang:
    default_gpu_memory_utilization: 0.9
    default_max_model_len: 32768
    default_port: 8100
    enabled: false
    venv_path: /root/ai-os/venvs/sglang
  vllm:
    default_port: 8000
    enabled: true
  venv_path: /root/ai-suite/vllm_env
feature_flags:
  agent_blocked_commands:
  - rm
  - shutdown
  - reboot
  - mkfs
  agent_command_enabled: true
  download_resume_enabled: true
  multi_engine_enabled: true
  sse_push_enabled: true
go_api:
  admin_whitelist:
    allowed_ips:
    - 127.0.0.1
    - ::1
    block_write_non_whitelist: true
    enabled: true
  host: 0.0.0.0
  manage_backend_url: http://localhost:35000
  port: 35001
llama_cpp:
  default_ctx_size: 4096
  default_host: 0.0.0.0
  default_n_gpu_layers: -1
  models_base_path: /mnt/pve_models
  server_module: llama_cpp.server
model_groups:
  Gemma-4-31B: ^Gemma-4-31B
  Qwen2.5-72B: ^Qwen2\.5-72B
  Qwen3-235B: ^Qwen3-235B
  Qwen3.6-35B: ^Qwen3\.6-35B
  deepseek-r1: ^deepseek-r1
  llama-3.3-70b: ^llama-3\.3-70b
  midnight-miqu-103b: ^midnight-miqu-103b
  qwen2.5-72b: ^qwen2\.5-72b
models:
  Gemma-4-31B-Abliterated:
    ctx_size: 4096
    description: Gemma 4 31B 模型（去审查版）
    engine_type: vllm
    extra_args: []
    host: 0.0.0.0
    keep_alive: true
    llamacpp_params: {}
    model_path: /mnt/pve_models/Gemma-4-31B-Abliterated
    n_gpu_layers: -1
    port: 8000
    preload: true
    required_memory: 40GB
    service: vllm-aiclient
    sglang_params: {}
    supports_image_generation: false
    supports_images: true
    supports_tool_calling: true
    vllm_params:
      attention_backend: TRITON_ATTN
      enable_chunked_prefill: true
      gpu_memory_utilization: 0.9
      max_model_len: 40960
      max_num_batched_tokens: 16384
      max_num_seqs: 256
