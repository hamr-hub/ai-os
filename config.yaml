app_controller:
  admin_whitelist:
    allowed_ips:
    - 127.0.0.1
    - ::1
    block_write_non_whitelist: true
    enabled: true
  auth:
    api_keys: []
  cors_origins:
  - http://localhost:30001
  - http://localhost:30000
  host: 0.0.0.0
  port: 35000
  trusted_proxies:
  - 127.0.0.0/8
  - ::1/128
  websocket:
    enabled: true
    path: /ws
    ping_interval: 30
    ping_timeout: 10
discovery:
  auto_discover: true
  priority: scan_first
engines:
  hub:
    hf_endpoint: https://hf-mirror.com
    save_root: /mnt/pve_models
    sources:
    - local
    - huggingface
    - modelscope
  llamacpp:
    default_port: 8001
    enabled: true
    venv_path: /root/ai-os/venvs/llamacpp
  sglang:
    default_gpu_memory_utilization: 0.9
    default_max_model_len: 32768
    default_port: 8100
    enabled: true
    env_vars:
      CUDACXX: /root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cu13/bin/nvcc
      CUDA_HOME: /root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cu13
      LD_LIBRARY_PATH: /root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cu13/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cublas/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cuda_cupti/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cuda_nvrtc/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cuda_runtime/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cudnn/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cufft/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cufile/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/curand/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cusolver/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cusparse/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cusparselt/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/nccl/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/nvjitlink/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/nvshmem/lib:/root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/nvtx/lib
      PATH: /root/ai-os/venvs/sglang/lib/python3.13/site-packages/nvidia/cu13/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    venv_path: /root/ai-os/venvs/sglang
  vllm:
    default_port: 8000
    enabled: true
  venv_path: /root/ai-suite/vllm_env
feature_flags:
  agent_blocked_commands:
  - rm
  - shutdown
  - reboot
  - mkfs
  agent_command_enabled: true
  download_resume_enabled: true
  multi_engine_enabled: true
  sse_push_enabled: true
