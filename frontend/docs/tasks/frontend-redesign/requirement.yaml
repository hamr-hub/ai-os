requirement_id: frontend-redesign-test-plan
title: "ai-os Vue3前端 + aiclient2api插件 - 测试计划与测试用例全覆盖"
source: "docs/agent/prd.md"
version: v1.0
created_at: "2026-04-30"
developer: heyongxian

business_goal:
  target_users:
    - 管理员/运维人员（B端管控面板用户）
    - C端开发者/客户端（推理API调用者）
  problem_to_solve: "前端Vue3管控面板和aiclient2api插件缺少系统性测试覆盖，当前仅有7个composable测试和3个store测试，缺失所有新页面(Vue组件)、新composable(useAuth/useConfigManagement/useEngineManagement/useHealthOps/useRateLimit/useModelDownload/useModelPool/useModelSearch/useModelSwitch/usePolling/useLLMService/useGPUMemory/useGPUMemoryCheck/useGPUHistory/useGPUChartDatasets/useTokenHistory)、新store(auth/modelPool/gpu)、新API client函数(搜索/下载/模型池/引擎/限流/配置/健康)的测试"
  success_metrics:
    - metric: test_coverage_rate
      target: "≥80% composable/store覆盖"
      observable: true
    - metric: test_case_count
      target: "≥100个测试用例"
      observable: true
    - metric: all_tests_pass
      target: "vitest run 全PASS"
      observable: true

scope:
  in_scope:
    - "所有前端composable单元测试(21个composable)"
    - "所有前端store单元测试(6个store)"
    - "API client关键函数单元测试"
    - "Vue组件基础渲染测试(14个页面)"
    - "E2E关键路径测试(Dashboard/ModelManagement/ModelHub/ModelPool)"
    - "aiclient2api插件核心功能测试"
  out_of_scope:
    - "Go后端测试(app-controller/go-vllm-api不在前端)"
    - "Python后端测试(app-controller后端逻辑)"
    - "性能压测"
    - "Docker部署测试"

key_interactions:
  main_entry: "Dashboard页面(/) → 侧栏导航 → 各管理页面"
  user_paths:
    - path: "管理员查看GPU状态"
      steps: ["访问Dashboard", "查看GPU概览卡片", "查看运行模型卡片", "查看vLLM指标"]
    - path: "管理员切换模型"
      steps: ["进入ModelManagement", "选择目标模型", "点击切换", "查看进度", "确认完成"]
    - path: "管理员搜索下载模型"
      steps: ["进入ModelHub", "输入关键词搜索", "选择模型", "点击下载", "等待下载完成", "一键加载到池"]
    - path: "管理员管理模型池"
      steps: ["进入ModelPool", "查看池内模型列表", "加载模型/删除模型", "查看运行状态"]
    - path: "管理员配置限流"
      steps: ["进入RateLimit", "查看当前配置", "修改QPS限制", "保存配置"]
  key_states:
    - "模型切换中(phase1-4进度)"
    - "下载进行中(进度百分比)"
    - "GPU显存不足(告警状态)"
    - "WS断连降级到轮询"

acceptance_criteria:
  - id: AC-01
    given: "前端测试框架(vitest)已配置"
    when: "执行vitest run"
    then: "所有composable测试通过且覆盖率≥80%"
    testable: true
  - id: AC-02
    given: "前端测试框架(vitest)已配置"
    when: "执行vitest run"
    then: "所有store测试通过且覆盖率≥80%"
    testable: true
  - id: AC-03
    given: "前端测试框架(vitest)已配置"
    when: "执行vitest run"
    then: "API client关键函数测试通过(search/download/pool/engine/ratelimit/config/health)"
    testable: true
  - id: AC-04
    given: "前端测试框架(vitest)已配置"
    when: "执行vitest run"
    then: "Vue组件基础渲染测试通过(14个页面组件)"
    testable: true
  - id: AC-05
    given: "Playwright已配置"
    when: "执行playwright test"
    then: "4条E2E关键路径测试通过(Dashboard/ModelManagement/ModelHub/ModelPool)"
    testable: true
  - id: AC-06
    given: "测试计划已生成"
    when: "检查docs/tasks/frontend-redesign/目录"
    then: "存在test-plan.yaml和test-plan.md文件，包含完整测试矩阵"
    testable: true

data_interfaces:
  - name: "Python B端API"
    base_url: "/api"
    endpoints:
      - "GET /gpu/summary"
      - "GET /gpu/enhanced"
      - "GET /gpu/processes"
      - "GET /vllm/metrics"
      - "GET /models"
      - "POST /switch/atomic"
      - "GET /default-model"
      - "POST /default-model/:name"
      - "GET /models/aggregated"
      - "GET /models/:name/vllm-config"
      - "PUT /models/:name/vllm-config"
      - "GET /manage/models/search"
      - "GET /manage/gpu/recommend"
      - "POST /manage/gpu/memory-check/:model"
      - "POST /manage/models/download"
      - "GET /manage/models/download/:task_id/status"
      - "DELETE /manage/models/download/:task_id"
      - "GET /manage/models/downloads"
      - "GET /manage/models/pool"
      - "POST /manage/models/pool/:name/load"
      - "DELETE /manage/models/pool/:name"
      - "GET /manage/engine/status"
      - "POST /manage/engine/switch"
      - "GET /engines/config"
      - "PUT /engines/config"
      - "GET /gpu/memory-check"
      - "GET /manage/ratelimit/config"
      - "PUT /manage/ratelimit/config"
      - "GET /manage/ratelimit/stats"
      - "GET /manage/config/global"
      - "PUT /manage/config/global"
      - "GET /manage/health/detailed"
      - "GET /manage/health/history"
  - name: "Go C端API"
    base_url: "/v1"
    endpoints:
      - "GET /v1/models"
      - "POST /v1/chat/completions"

implicit_requirements:
  - id: IR-01
    scenario: "网络异常/后端离线"
    description: "所有composable/store必须处理API错误场景(网络断开/超时/503)"
    severity: P0
  - id: IR-02
    scenario: "WebSocket断连降级"
    description: "usePolling/useGPU/useModelPool需测试WS断连→轮询降级逻辑"
    severity: P0
  - id: IR-03
    scenario: "边界数据"
    description: "空数据/null/undefined/超大数据的渲染和计算需覆盖"
    severity: P1

ambiguity_score:
  business_goal_clarity: 90
  interaction_completeness: 85
  ac_testability: 95
  data_contract_certainty: 90
  overall: 90

implementation_context:
  code_complete: true
  test_complete: false
  note: "前端代码已全部实现，7个composable测试+3个store测试已存在，需补充其余测试覆盖"
  missing_items:
    - "14个新composable的单元测试"
    - "3个新store的单元测试"
    - "API client新增函数的测试"
    - "14个页面组件的渲染测试"
    - "E2E关键路径测试"
