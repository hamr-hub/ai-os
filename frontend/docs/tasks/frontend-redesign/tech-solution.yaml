meta:
  title: "ai-os前端测试计划与测试用例全覆盖"
  platform: "frontend"
  requirement_id: "frontend-redesign-test-plan"
  requirement_version: "v1.0"
  developer: "heyongxian"
  created_at: "2026-04-30"
  business_goal: "为Vue3前端管控面板和aiclient2api插件提供系统性测试覆盖，确保≥80%composable/store覆盖率，≥100个测试用例，vitest全PASS"
  requirement_confidence: "high"

scope:
  in_scope:
    - "前端composable单元测试(14个新composable)"
    - "前端store单元测试(3个新store)"
    - "API client新增函数测试"
    - "Vue页面组件基础渲染测试(14个页面)"
    - "E2E关键路径测试(4条)"
    - "aiclient2api插件核心功能测试"
  out_of_scope:
    - "Go后端测试"
    - "Python后端测试"
    - "性能压测"
    - "Docker部署测试"

global_constraints:
  - "测试框架: vitest + @vue/test-utils + happy-dom"
  - "测试风格: 中文describe/it，遵循现有测试模式(vi.mock + createPinia + beforeEach)"
  - "Mock策略: vi.mock('@/api/client')统一mock所有API函数"
  - "Store测试: createPinia + setActivePinia + beforeEach"
  - "禁止lint全量检查: 必须增量检查"

