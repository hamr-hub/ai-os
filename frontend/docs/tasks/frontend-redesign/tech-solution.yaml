validation:
  acceptance:
    - id: "V-01"
      criteria: "vitest run全部composable/store测试PASS"
      test_command: "cd frontend && npx vitest run"
    - id: "V-02"
      criteria: "测试用例总数≥100"
      test_command: "cd frontend && npx vitest run | grep 'Tests'"
    - id: "V-03"
      criteria: "pnpm build通过(无类型错误)"
      test_command: "cd frontend && pnpm build"
    - id: "V-04"
      criteria: "增量lint检查通过"
      test_command: "git diff --name-only HEAD | grep '.test.ts$' | xargs eslint"

risks:
  - level: "P1"
    description: "useModelSwitch和useModelDownload涉及WebSocket逻辑，测试需mockWebSocket构造函数和onUnmounted"
    mitigation: "使用vi.stubGlobal('WebSocket', mockWS)和vi.mock('vue', async=>({...await import('vue'),onUnmounted:vi.fn()}))"
  - level: "P1"
    description: "usePolling涉及onMounted/onUnmounted生命周期，测试需mockvue生命周期"
    mitigation: "使用vi.mock('vue')替换onMounted/onUnmounted为vi.fn()"
  - level: "P2"
    description: "部分页面组件渲染测试可能因Chart.js依赖导致测试环境问题"
    mitigation: "mock chart.js相关依赖，只测试基本DOM渲染"

open_questions: []

test_strategy:
  framework: "vitest"
  test_types:
    - type: "unit"
      scope: "composables, stores, api/client functions"
      count_estimate: 80
    - type: "component"
      scope: "Vue page view components"
      count_estimate: 20
    - type: "e2e"
      scope: "Dashboard/ModelManagement/ModelHub/ModelPool关键路径"
      count_estimate: 4
  mock_strategy:
    api_client: "vi.mock('@/api/client')统一mock所有API函数"
    pinia: "createPinia() + setActivePinia() + beforeEach()"
    vue_lifecycle: "vi.mock('vue')替换onMounted/onUnmounted/onUnmounted"
    websocket: "vi.stubGlobal('WebSocket', MockWebSocket)"
    localStorage: "vi.stubGlobal('localStorage', mockLocalStorage)"
